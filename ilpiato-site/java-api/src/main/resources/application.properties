server.port=8080
server.servlet.context-path=/java
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ilpiatto_db
spring.datasource.username=ilpiatto
spring.datasource.password=${DB_PASSWORD}

# JSON 필드를 Python API와 같은 snake_case로 (ingredientCost -> ingredient_cost)
spring.jackson.property-naming-strategy=SNAKE_CASE

# ── 로그 기록 ──
# 파일 하나에 이어 쓰고, 일주일마다 log_backup.py가 백업 후 비운다.
logging.file.name=/var/log/ilpiatto/java-api.log
# 스프링이 스스로 파일을 나누지 않도록 크기 한도를 넉넉하게 (나눠져도 백업 스크립트가 함께 처리)
logging.logback.rollingpolicy.max-file-size=500MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} | %-5level | %msg%n%ex
