server.port=8080
server.servlet.context-path=/java
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ilpiato_db
spring.datasource.username=ilpiato
spring.datasource.password=${DB_PASSWORD}

# JSON 필드를 Python API와 같은 snake_case로 (ingredientCost -> ingredient_cost)
spring.jackson.property-naming-strategy=SNAKE_CASE
