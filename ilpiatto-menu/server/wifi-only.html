<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매장 Wi-Fi 전용 메뉴판</title>
<style>
:root { --bg:#F3F0E8; --ink:#1D2A24; --muted:#5E6B63; --brass:#8C6A2F; --line:#CFC6B2; }
@media (prefers-color-scheme: dark) { :root { --bg:#111A16; --ink:#ECE6D8; --muted:#A3AA9F; --brass:#C9AA6B; --line:#3A4740; color-scheme: dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
       font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif; text-align:center;
       padding:24px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px)); box-sizing:border-box; }
.card { max-width:22em; display:flex; flex-direction:column; gap:14px; }
.mark { font-family:"Cormorant Garamond","Times New Roman",serif; font-style:italic; font-size:44px; line-height:1; margin:0; }
.rule { width:60px; height:1px; background:var(--line); margin:4px auto; }
h1 { font-size:18px; font-weight:600; margin:0; }
p { margin:0; font-size:14px; line-height:1.7; color:var(--muted); }
b { color:var(--brass); font-weight:600; }
</style>
</head>
<body>
<main class="card">
  <p class="mark">Il Piatto</p>
  <div class="rule"></div>
  <h1>매장 Wi-Fi에서만 열리는 메뉴판입니다</h1>
  <p>테이블의 <b>Wi-Fi QR</b>로 매장 Wi-Fi에 연결한 뒤<br>메뉴 QR을 다시 찍어 주세요.</p>
  <p>연결이 어려우면 직원에게 말씀해 주세요.</p>
</main>
</body>
</html>
