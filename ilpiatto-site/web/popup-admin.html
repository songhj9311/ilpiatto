<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팝업 관리 · 일피아또 관리자</title>
<style>
  :root { --bg: #f4f5f0; --card: #fff; --ink: #1e2b23; --muted: #5d6a61; --line: #d5dad2; --brass: #8f6a2f; --bad: #a33a2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141b17; --card: #1d2621; --ink: #e7ebe4; --muted: #a2aea5; --line: #34403a; --brass: #c9a365; --bad: #e07a6a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* label의 display:grid 보다 우선해서 숨기기 */
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { margin: 0 0 4px; font-size: 24px; font-weight: 500; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .sub a { color: var(--brass); }
  .grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .grid { grid-template-columns: 360px 1fr; align-items: start; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0; }
  .card h2 { margin: 0 0 14px; font-size: 17px; font-weight: 500; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; }
  textarea { min-height: 90px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }
  .check input { width: auto; }
  .hint { font-size: 12px; color: var(--muted); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 999px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--ink); background: none; color: var(--ink); }
  button.solid { background: var(--ink); color: var(--bg); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button.small { padding: 5px 12px; font-size: 13px; }
  .msg { min-height: 1.6em; font-size: 14px; }
  .msg.err { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 400; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .tag.on { border-color: var(--brass); color: var(--brass); }
  .off td { opacity: .5; }
  .scroll { overflow-x: auto; }
  td:nth-child(3), td:nth-child(4) { white-space: nowrap; }
  td .btns { flex-wrap: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>팝업 관리</h1>
  <p class="sub">홍보 사이트에 뜨는 팝업(공지사항 · 신메뉴 출시 예정)을 관리합니다. 저장하면 1분 안에 <a href="/" target="_blank" rel="noopener">홍보 사이트</a>에 반영됩니다.</p>

  <div class="grid">
    <div class="card">
      <h2 id="form-title">새 항목 추가</h2>
      <form id="f">
        <input type="hidden" name="id">
        <label>종류
          <select name="kind">
            <option value="notice">공지사항</option>
            <option value="new_menu">신메뉴 출시 예정</option>
          </select>
        </label>
        <label><span id="title-label">제목</span>
          <input name="title" maxlength="60" required placeholder="예: 11월 정기 휴무 안내">
        </label>
        <label>내용
          <textarea name="body" maxlength="300" placeholder="줄바꿈은 그대로 보입니다 (300자까지)"></textarea>
        </label>
        <label id="launch-wrap" hidden>출시일
          <input type="date" name="launch_date">
          <span class="hint">출시일까지 D-day가 표시되고, 출시 7일 뒤 팝업에서 자동으로 내려갑니다.</span>
        </label>
        <label>사진 주소 (선택)
          <input name="image_url" placeholder="images/popup/new-pizza.jpg">
          <span class="hint">홍보 사이트 images/popup 폴더에 사진을 넣고 그 경로를 적으세요.</span>
        </label>
        <div class="two">
          <label>보이기 시작<input type="date" name="show_from"></label>
          <label>보이기 끝<input type="date" name="show_until"></label>
        </div>
        <span class="hint">시작을 비우면 오늘부터, 끝을 비우면 계속 보입니다.</span>
        <div class="two">
          <label>순서 (작을수록 위)<input type="number" name="sort_order" min="0" max="999" value="0"></label>
          <label class="check" style="align-self:end"><input type="checkbox" name="active" checked> 팝업에 보이기</label>
        </div>
        <div class="btns">
          <button class="solid" type="submit" id="save">추가</button>
          <button type="button" id="new-item">새로 쓰기</button>
        </div>
        <div class="msg" id="msg" role="status"></div>
      </form>
    </div>

    <div class="card">
      <h2>등록된 항목</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>종류</th><th>제목</th><th>출시일</th><th>보이는 기간</th><th>상태</th><th></th></tr></thead>
          <tbody id="list"><tr><td colspan="6">불러오는 중…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const API = "/py/api/popup-items";      // Java를 쓰려면 "/java/api/popup-items"
  const f = document.getElementById("f");
  const msg = document.getElementById("msg");
  let items = [];

  const say = (text, err = false) => { msg.textContent = text; msg.className = "msg" + (err ? " err" : ""); };
  const cell = (text) => { const td = document.createElement("td"); td.textContent = text ?? ""; return td; };
  const today = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Seoul" }).format(new Date());

  function syncKind() {
    const isMenu = f.kind.value === "new_menu";
    document.getElementById("launch-wrap").hidden = !isMenu;
    f.launch_date.required = isMenu;
    document.getElementById("title-label").textContent = isMenu ? "신메뉴 이름" : "제목";
    f.title.placeholder = isMenu ? "예: 루꼴라 스트라차텔라 피자" : "예: 11월 정기 휴무 안내";
  }
  f.kind.addEventListener("change", syncKind);

  function status(p) {
    if (!p.active) return ["꺼짐", false];
    if (p.show_from && p.show_from > today) return ["예약", false];
    if (p.show_until && p.show_until < today) return ["기간 끝", false];
    if (p.kind === "new_menu" && p.launch_date) {
      const d = Math.round((Date.parse(p.launch_date) - Date.parse(today)) / 86400000);
      if (d < -7) return ["출시 후 내려감", false];
    }
    return ["보이는 중", true];
  }

  async function errorText(res) {
    try {
      const j = await res.json();
      if (Array.isArray(j.detail)) return j.detail.map((d) => d.msg.replace(/^Value error, /, "")).join(" / ");
      return j.detail || j.message || res.statusText;
    } catch (_) { return res.statusText; }
  }

  async function load() {
    const res = await fetch(API);
    if (!res.ok) { say("목록을 불러오지 못했습니다: " + await errorText(res), true); return; }
    items = (await res.json()).items;
    const tb = document.getElementById("list");
    tb.replaceChildren();
    if (!items.length) { const tr = document.createElement("tr"); tr.append(cell("등록된 항목이 없습니다.")); tr.firstChild.colSpan = 6; tb.append(tr); return; }
    for (const p of items) {
      const [st, on] = status(p);
      const tr = document.createElement("tr");
      if (!on) tr.className = "off";
      const tag = document.createElement("span"); tag.className = "tag" + (on ? " on" : ""); tag.textContent = st;
      const stTd = document.createElement("td"); stTd.append(tag);
      const act = document.createElement("td"); const b = document.createElement("div"); b.className = "btns";
      const edit = document.createElement("button"); edit.className = "small"; edit.textContent = "수정"; edit.onclick = () => fill(p);
      const del = document.createElement("button"); del.className = "small danger"; del.textContent = "삭제"; del.onclick = () => remove(p);
      b.append(edit, del); act.append(b);
      tr.append(cell(p.kind === "notice" ? "공지" : "신메뉴"), cell(p.title), cell(p.launch_date || "-"),
        cell(`${p.show_from || ""} ~ ${p.show_until || "계속"}`), stTd, act);
      tb.append(tr);
    }
  }

  function fill(p) {
    for (const k of ["id", "kind", "title", "body", "launch_date", "image_url", "show_from", "show_until", "sort_order"]) {
      f[k].value = p[k] ?? "";
    }
    f.active.checked = p.active;
    syncKind();
    document.getElementById("form-title").textContent = "항목 수정";
    document.getElementById("save").textContent = "수정 저장";
    say("");
    f.scrollIntoView({ behavior: "smooth" });
  }

  function reset() {
    f.reset(); f.id.value = ""; syncKind();
    document.getElementById("form-title").textContent = "새 항목 추가";
    document.getElementById("save").textContent = "추가";
  }
  document.getElementById("new-item").onclick = () => { reset(); say(""); };

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      kind: f.kind.value, title: f.title.value, body: f.body.value,
      launch_date: f.kind.value === "new_menu" ? (f.launch_date.value || null) : null,
      image_url: f.image_url.value.trim() || null,
      show_from: f.show_from.value || null, show_until: f.show_until.value || null,
      sort_order: Number(f.sort_order.value || 0), active: f.active.checked,
    };
    const id = f.id.value;
    const res = await fetch(id ? `${API}/${id}` : API, {
      method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (!res.ok) { say("저장하지 못했습니다: " + await errorText(res), true); return; }
    say(id ? "수정했습니다." : "추가했습니다.");
    reset(); load();
  });

  async function remove(p) {
    if (!confirm(`'${p.title}'을(를) 삭제할까요? 잠시 숨기려면 수정에서 '팝업에 보이기'를 끄세요.`)) return;
    const res = await fetch(`${API}/${p.id}`, { method: "DELETE" });
    if (!res.ok) { say("삭제하지 못했습니다: " + await errorText(res), true); return; }
    say("삭제했습니다."); load();
  }

  syncKind();
  load();
</script>
</body>
</html>
